{% extends "base.html" %}
{% block page %}

    <section class="box errorbox">
      <p class="errorbox__code">{{ code }}</p>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <p><a class="btn" href="{{ url_for('main.home') }}">Back to the latest entries</a></p>
    </section>
  </main>
{% endblock %}
