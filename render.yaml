services:
  - type: web
    name: pyvejournal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi db upgrade && gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
